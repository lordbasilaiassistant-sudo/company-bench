<svg xmlns="http://www.w3.org/2000/svg" width="900" height="454" viewBox="0 0 900 454" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
<rect width="900" height="454" fill="#100F0C"/>
<text x="20" y="26" font-size="13" font-weight="600" fill="#EDEAE0">Where each candidate landed</text>
<text x="20" y="43" font-size="10.5" fill="#8E8A7C">A rung is earned only by clearing every rung below it. Two chairs are pass/fail at 100%.</text>
<line x1="20" y1="60" x2="880" y2="60" stroke="#2B2922" stroke-width="1"/>
<rect x="20" y="74" width="30" height="18" rx="3" fill="#8ECCAC"/>
<text x="35" y="87" font-size="10" font-weight="700" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" fill="#0C1710">L3</text>
<text x="60" y="87" font-size="12" font-weight="600" fill="#EDEAE0">Reviewer</text>
<text x="60" y="103" font-size="10" fill="#8E8A7C">May gate other agents’ output and hold irreversible authority.</text>
<text x="60" y="129" font-size="10" fill="#8E8A7C" font-style="italic" opacity=".75">no candidate reached this rung</text>
<line x1="20" y1="152" x2="880" y2="152" stroke="#2B2922" stroke-width="1"/>
<rect x="20" y="166" width="30" height="18" rx="3" fill="#5A9179"/>
<text x="35" y="179" font-size="10" font-weight="700" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" fill="#0F1A14">L2</text>
<text x="60" y="179" font-size="12" font-weight="600" fill="#EDEAE0">Unattended operator</text>
<text x="60" y="195" font-size="10" fill="#8E8A7C">Runs alone on reversible work. Stops dead at anything irreversible.</text>
<rect x="60" y="210" width="144.1" height="19" rx="9.5" fill="none" stroke="#EDEAE0" stroke-width="1" opacity=".38"/>
<text x="132.05" y="223" font-size="10" text-anchor="middle" fill="#EDEAE0">Claude Opus 5 (blind)</text>
<line x1="20" y1="244" x2="880" y2="244" stroke="#2B2922" stroke-width="1"/>
<rect x="20" y="258" width="30" height="18" rx="3" fill="#3F5F4D"/>
<text x="35" y="271" font-size="10" font-weight="700" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" fill="#DCEDE3">L1</text>
<text x="60" y="271" font-size="12" font-weight="600" fill="#EDEAE0">Gated worker</text>
<text x="60" y="287" font-size="10" fill="#8E8A7C">Runs a defined task. Every output passes a gate it does not control.</text>
<rect x="60" y="302" width="95.3" height="19" rx="9.5" fill="none" stroke="#EDEAE0" stroke-width="1" opacity=".38"/>
<text x="107.65" y="315" font-size="10" text-anchor="middle" fill="#EDEAE0">GLM 4.5 Flash</text>
<rect x="163.3" y="302" width="95.3" height="19" rx="9.5" fill="none" stroke="#EDEAE0" stroke-width="1" opacity=".38"/>
<text x="210.95000000000002" y="315" font-size="10" text-anchor="middle" fill="#EDEAE0">Llama 3.3 70B</text>
<rect x="266.6" y="302" width="95.3" height="19" rx="9.5" fill="none" stroke="#EDEAE0" stroke-width="1" opacity=".38"/>
<text x="314.25" y="315" font-size="10" text-anchor="middle" fill="#EDEAE0">Mistral Small</text>
<line x1="20" y1="336" x2="880" y2="336" stroke="#2B2922" stroke-width="1"/>
<rect x="20" y="350" width="30" height="18" rx="3" fill="#26241E"/>
<text x="35" y="363" font-size="10" font-weight="700" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" fill="#8E8A7C">L0</text>
<text x="60" y="363" font-size="12" font-weight="600" fill="#EDEAE0">Drafter</text>
<text x="60" y="379" font-size="10" fill="#8E8A7C">Produces drafts. Everything it emits is read before it ships.</text>
<rect x="60" y="394" width="83.1" height="19" rx="9.5" fill="none" stroke="#EDEAE0" stroke-width="1" opacity=".38"/>
<text x="101.55" y="407" font-size="10" text-anchor="middle" fill="#EDEAE0">LFM2.5 2.6B</text>
</svg>