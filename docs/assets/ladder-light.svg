<rect x="20" y="74" width="30" height="18" rx="3" fill="#376856"/>
<text x="35" y="87" font-size="10" font-weight="700" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" fill="#FFFFFF">L3</text>
<text x="60" y="87" font-size="12" font-weight="600" fill="#16150F">Reviewer</text>
<text x="60" y="103" font-size="10" fill="#6B6759">May gate other agents’ output and hold irreversible authority.</text>
<rect x="60" y="118" width="144.1" height="19" rx="9.5" fill="none" stroke="#16150F" stroke-width="1" opacity=".38"/>
<text x="132.05" y="131" font-size="10" text-anchor="middle" fill="#16150F">Claude Opus 5 (blind)</text>
<line x1="20" y1="152" x2="880" y2="152" stroke="#E4E0D5" stroke-width="1"/>
<rect x="20" y="166" width="30" height="18" rx="3" fill="#6E9C84"/>
<text x="35" y="179" font-size="10" font-weight="700" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" fill="#FFFFFF">L2</text>
<text x="60" y="179" font-size="12" font-weight="600" fill="#16150F">Unattended operator</text>
<text x="60" y="195" font-size="10" fill="#6B6759">Runs alone on reversible work. Stops dead at anything irreversible.</text>
<text x="60" y="221" font-size="10" fill="#6B6759" font-style="italic" opacity=".75">no candidate reached this rung</text>
<line x1="20" y1="244" x2="880" y2="244" stroke="#E4E0D5" stroke-width="1"/>
<rect x="20" y="258" width="30" height="18" rx="3" fill="#A9C0AE"/>
<text x="35" y="271" font-size="10" font-weight="700" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" fill="#25382D">L1</text>
<text x="60" y="271" font-size="12" font-weight="600" fill="#16150F">Gated worker</text>
<text x="60" y="287" font-size="10" fill="#6B6759">Runs a defined task. Every output passes a gate it does not control.</text>
<rect x="60" y="302" width="89.19999999999999" height="19" rx="9.5" fill="none" stroke="#16150F" stroke-width="1" opacity=".38"/>
<text x="104.6" y="315" font-size="10" text-anchor="middle" fill="#16150F">GPT-OSS 120B</text>
<rect x="157.2" y="302" width="95.3" height="19" rx="9.5" fill="none" stroke="#16150F" stroke-width="1" opacity=".38"/>
<text x="204.85" y="315" font-size="10" text-anchor="middle" fill="#16150F">GLM 4.5 Flash</text>
<rect x="260.5" y="302" width="95.3" height="19" rx="9.5" fill="none" stroke="#16150F" stroke-width="1" opacity=".38"/>
<text x="308.15" y="315" font-size="10" text-anchor="middle" fill="#16150F">Mistral Small</text>
