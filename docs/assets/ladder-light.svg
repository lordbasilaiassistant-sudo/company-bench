<rect x="20" y="350" width="30" height="18" rx="3" fill="#E7E1D4"/>
<text x="35" y="363" font-size="10" font-weight="700" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" fill="#5C564A">L0</text>
<text x="60" y="363" font-size="12" font-weight="600" fill="#16150F">Drafter</text>
<text x="60" y="379" font-size="10" fill="#6B6759">Produces drafts. Everything it emits is read before it ships.</text>
