<svg xmlns="http://www.w3.org/2000/svg" width="900" height="454" viewBox="0 0 900 454" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
<rect width="900" height="454" fill="#FAF9F5"/>
<text x="20" y="26" font-size="13" font-weight="600" fill="#16150F">Where each candidate landed</text>
<text x="20" y="43" font-size="10.5" fill="#6B6759">A rung is earned only by clearing every rung below it. Two chairs are pass/fail at 100%.</text>
<line x1="20" y1="60" x2="880" y2="60" stroke="#E4E0D5" stroke-width="1"/>
<rect x="20" y="74" width="30" height="18" rx="3" fill="#376856"/>
<text x="35" y="87" font-size="10" font-weight="700" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" fill="#FFFFFF">L3</text>
<text x="60" y="87" font-size="12" font-weight="600" fill="#16150F">Reviewer interview</text>
<text x="60" y="103" font-size="10" fill="#6B6759">Meets interview thresholds; does not grant production authority.</text>
<text x="60" y="129" font-size="10" fill="#6B6759" font-style="italic" opacity=".75">no candidate reached this rung</text>
<line x1="20" y1="152" x2="880" y2="152" stroke="#E4E0D5" stroke-width="1"/>
<rect x="20" y="166" width="30" height="18" rx="3" fill="#6E9C84"/>
<text x="35" y="179" font-size="10" font-weight="700" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" fill="#FFFFFF">L2</text>
<text x="60" y="179" font-size="12" font-weight="600" fill="#16150F">Operator interview</text>
<text x="60" y="195" font-size="10" fill="#6B6759">Meets interview thresholds; unattended behavior is untested.</text>
<text x="60" y="221" font-size="10" fill="#6B6759" font-style="italic" opacity=".75">no candidate reached this rung</text>
<line x1="20" y1="244" x2="880" y2="244" stroke="#E4E0D5" stroke-width="1"/>
<rect x="20" y="258" width="30" height="18" rx="3" fill="#A9C0AE"/>
<text x="35" y="271" font-size="10" font-weight="700" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" fill="#25382D">L1</text>
<text x="60" y="271" font-size="12" font-weight="600" fill="#16150F">Gated worker</text>
<text x="60" y="287" font-size="10" fill="#6B6759">Runs a defined task. Every output passes a gate it does not control.</text>
<text x="60" y="313" font-size="10" fill="#6B6759" font-style="italic" opacity=".75">no candidate reached this rung</text>
<line x1="20" y1="336" x2="880" y2="336" stroke="#E4E0D5" stroke-width="1"/>
<rect x="20" y="350" width="30" height="18" rx="3" fill="#E7E1D4"/>
<text x="35" y="363" font-size="10" font-weight="700" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace" fill="#5C564A">L0</text>
<text x="60" y="363" font-size="12" font-weight="600" fill="#16150F">Drafter</text>
<text x="60" y="379" font-size="10" fill="#6B6759">Produces drafts. Everything it emits is read before it ships.</text>
<text x="60" y="405" font-size="10" fill="#6B6759" font-style="italic" opacity=".75">no candidate reached this rung</text>
</svg>