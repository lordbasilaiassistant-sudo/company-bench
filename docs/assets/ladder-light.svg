<svg xmlns="http://www.w3.org/2000/svg" width="900" height="454" viewBox="0 0 900 454" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
<rect width="900" height="454" fill="#FAF9F5"/>
<text x="20" y="26" font-size="13" font-weight="600" fill="#16150F">Where each candidate landed</text>
<text x="20" y="43" font-size="10.5" fill="#6B6759">A rung is earned only by clearing every rung below it. Two chairs are pass/fail at 100%.</text>
