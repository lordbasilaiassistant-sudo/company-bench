name: selftest

# The bench must accept every reference answer and reject every decoy, on every push.
# A benchmark whose scorers are not themselves tested is decor.
on:
  push:
  pull_request:

jobs:
  scorers:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Every chair accepts its gold answer and rejects its decoy
        run: node bench/selftest.mjs
      - name: Public runner, coverage and coding integrity regressions
        run: npm test
      - name: Executed coding reference and negative controls
        run: node bench/coding/selftest.mjs
      - name: The org chart loads
        run: node bench/run.mjs --list
      - name: No published file carries a credential-shaped string
        run: node scripts-guard.mjs
      # The README, llms.txt and the site's JSON-LD all state how many chairs exist. Those strings
      # are what an LLM reads when asked what this project is, and what a search engine indexes, so
      # a stale count is the project describing itself incorrectly to every automated reader it has.
      # They were hand-written and went stale across four department additions before this gate.
      - name: The chair and check counts in the docs are true
        run: node bench/sync-counts.mjs --selftest
      - name: Public report builds including empty baseline and historical archive
        run: node bench/report.mjs
      - name: The exam pack generates
        shell: bash
        run: node bench/take.mjs --out /tmp/pack && test -s /tmp/pack/TAKE-THE-BENCH.md
